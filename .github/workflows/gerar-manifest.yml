name: Atualizar manifest dos postos

on:
  push:
    paths:
      - 'clientes_postos_fotos/**'
      - '.github/workflows/gerar-manifest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Ler repositório
        uses: actions/checkout@v4

      - name: Gerar manifest.json
        shell: python
        run: |
          import json
          import re
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import quote

          ROOT = Path("clientes_postos_fotos")
          MANIFEST = ROOT / "manifest.json"

          IMAGE_EXTS = {".jpg", ".jpeg", ".png", ".webp", ".gif", ".bmp", ".avif"}

          def url_path(*parts):
              return "./" + "/".join(
                  quote(str(p), safe="") for p in parts
              )

          def normalizar_gps(texto):
              numeros = re.findall(r"[-+]?\d{1,3}(?:[.,]\d+)?", texto)
              if len(numeros) < 2:
                  return ""
              try:
                  lat = float(numeros[0].replace(",", "."))
                  lon = float(numeros[1].replace(",", "."))
              except ValueError:
                  return ""
              if -90 <= lat <= 90 and -180 <= lon <= 180:
                  return f"{lat:g}, {lon:g}"
              return ""

          def extrair_gps(nomes):
              for nome in nomes:
                  gps = normalizar_gps(Path(nome).stem)
                  if gps:
                      return gps
              return ""

          def observacao_dos_nomes(nomes):
              limpos = [Path(n).stem.strip() for n in nomes]

              # Primeiro procura "obs", "observacao" ou "observações".
              for nome in limpos:
                  m = re.match(
                      r"^\s*obs(?:erva(?:ção|cao|ções|coes)?)?\s*[:=_-]?\s*(.+)$",
                      nome,
                      re.IGNORECASE,
                  )
                  if m and m.group(1).strip():
                      return re.sub(r"_+", " ", m.group(1).strip())

              # Depois usa um nome que não seja coordenadas nem "foto 3".
              for nome in limpos:
                  if normalizar_gps(nome):
                      continue
                  normalizado = re.sub(r"[._-]+", " ", nome).strip().lower()
                  if re.fullmatch(r"(?:foto\s*)?(?:n(?:r|o|umero)?\s*)?3", normalizado):
                      continue
                  if nome:
                      return re.sub(r"_+", " ", nome).strip()

              return ""

          companhias = []
          postos = []

          if ROOT.exists():
              for companhia_dir in sorted(
                  (p for p in ROOT.iterdir() if p.is_dir() and not p.name.startswith(".")),
                  key=lambda p: p.name.casefold()
              ):
                  nome_companhia = companhia_dir.name
                  logo = None
                  for candidato in ("logo.png", "logo.jpg", "logo.jpeg", "logo.webp"):
                      ficheiro_logo = companhia_dir / candidato
                      if ficheiro_logo.is_file():
                          logo = url_path("clientes_postos_fotos", nome_companhia, candidato)
                          break

                  companhia = {"nome": nome_companhia}
                  if logo:
                      companhia["logo"] = logo
                  companhias.append(companhia)

                  for posto_dir in sorted(
                      (p for p in companhia_dir.iterdir() if p.is_dir() and not p.name.startswith(".")),
                      key=lambda p: p.name.casefold()
                  ):
                      imagens = sorted(
                          (
                              p for p in posto_dir.iterdir()
                              if p.is_file()
                              and p.suffix.lower() in IMAGE_EXTS
                              and p.name.lower() not in {
                                  "logo.png", "logo.jpg", "logo.jpeg", "logo.webp"
                              }
                          ),
                          key=lambda p: p.name.casefold()
                      )

                      fotos = [
                          url_path("clientes_postos_fotos", nome_companhia, posto_dir.name, foto.name)
                          for foto in imagens
                      ]

                      nomes_fotos = [foto.name for foto in imagens]
                      gps = extrair_gps(nomes_fotos)
                      obs = observacao_dos_nomes(nomes_fotos)

                      # ID estável: se o nome da pasta mudar, o posto é considerado outro posto.
                      slug = re.sub(
                          r"[^a-z0-9]+",
                          "-",
                          f"{nome_companhia}-{posto_dir.name}".lower()
                      ).strip("-")

                      posto = {
                          "id": slug or f"posto-{len(postos)+1}",
                          "companhia": nome_companhia,
                          "nome": posto_dir.name,
                          "gps": gps,
                          "obs": obs,
                          "fotos": fotos,
                      }
                      postos.append(posto)

          manifest = {
              "geradoEm": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "companhias": companhias,
              "postos": postos,
          }

          ROOT.mkdir(parents=True, exist_ok=True)
          MANIFEST.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          print(f"Companhias encontradas: {len(companhias)}")
          print(f"Postos encontrados: {len(postos)}")
          print(f"Manifest criado: {MANIFEST}")

      - name: Guardar manifest atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clientes_postos_fotos/manifest.json
          if git diff --cached --quiet; then
            echo "O manifest já está atualizado."
          else
            git commit -m "Atualizar manifest dos postos"
            git push
          fi
